# A short power-button press suspends this laptop. That turns a stale-panel
# wake (see /usr/lib/bootc/kargs.d/10-amdgpu-psr.toml) into a loop: the screen
# looks frozen, the button gets pressed, the machine sleeps again, and the only
# way out is a hard power cut. Happened Jul 24, 25, 26 and three times on
# Jul 27 before the panel bug was found.
# Deliberate power actions go through the DMS power menu instead.
[Login]
HandlePowerKey=ignore
