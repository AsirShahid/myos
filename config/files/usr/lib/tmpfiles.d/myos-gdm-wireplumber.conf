# Install the greeter wireplumber bluetooth opt-out into gdm's stateful home.
# /var/lib/gdm itself is created by the gdm package.
d /var/lib/gdm/.config 0700 gdm gdm -
d /var/lib/gdm/.config/wireplumber 0755 gdm gdm -
d /var/lib/gdm/.config/wireplumber/wireplumber.conf.d 0755 gdm gdm -
C+ /var/lib/gdm/.config/wireplumber/wireplumber.conf.d/51-disable-bluetooth.conf 0644 gdm gdm - /usr/share/myos/gdm-wireplumber/51-disable-bluetooth.conf
