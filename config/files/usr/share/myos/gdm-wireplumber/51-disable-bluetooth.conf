# Keep the GDM greeter's wireplumber away from bluetooth. The greeter otherwise
# registers the bluez A2DP endpoints at boot and unregisters them when the user
# session's wireplumber takes over. A headset that auto-connects during that
# window loses its A2DP endpoints and stays HFP-only (mSBC, 16 kHz mono) until
# a manual reconnect. Root-caused 2026-07-29. Installed into the gdm user's
# config by tmpfiles.d/myos-gdm-wireplumber.conf.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
    monitor.bluez-midi = disabled
  }
}
