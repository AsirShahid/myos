# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: myos
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/bluefin-dx
image-version: latest

modules:
  - type: files
    files:
      - usr: /usr

  - type: dnf
    repos:
      copr:
        - atim/starship
        - yuezk/globalprotect-openconnect
        - yalter/niri
        - solopasha/hyprland  # hyprlock/hypridle (also source of hypr* tools already in the image)
        - avengemedia/danklinux  # dms-greeter + quickshell + danksearch + material-symbols-fonts
        - avengemedia/dms  # the dms CLI/shell itself (separate copr from danklinux)
        - scottames/ghostty
      files:
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
    install:
      # Fail the build if a package can't be found, instead of silently
      # shipping an image without it.
      skip-unavailable: false
      packages:
        # Editors and Terminal Tools
        - starship  # copr: atim/starship
        - helix
        - kitty
        - emacs

        # System Tools
        - timeshift
        - gnome-boxes
        - kdeconnectd
        - antimicrox
        - cliphist

        # Document Viewers
        - zathura
        - zathura-pdf-mupdf
        - zathura-ps
        - zathura-djvu

        # Icon Themes
        - papirus-icon-theme

        # VPN
        - mullvad-vpn  # repo: mullvad.repo
        - globalprotect-openconnect  # copr: yuezk/globalprotect-openconnect
        - openvpn
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        # Windscribe (GUI + windscribe-cli) is installed by
        # config/scripts/getwindscribe.sh (checksum-pinned RPM), not here, since
        # a GitHub release asset URL as a dnf package has no integrity check.

        # CLI Utilities
        - jq
        - atuin
        - fzf
        - dialog
        - gh  # GitHub CLI

        # Window Managers
        - niri  # copr: yalter/niri

        # Niri session extras (session configs live in dotfiles:
        # ~/.config/niri, ~/.config/hypr/hypr{lock,idle}.conf, ~/.config/swaync)
        - hyprlock  # copr: solopasha/hyprland
        - hypridle  # copr: solopasha/hyprland
        - SwayNotificationCenter  # swaync: notification daemon + control center

        # Login screen: greetd running the DankMaterialShell greeter, so the
        # login surface is the same one as the lock screen. Pulls in greetd
        # (Fedora) and quickshell (danklinux copr).
        # Shipping the packages does NOT flip the display manager. Run
        # `dms greeter enable` once on the host to write /etc/greetd/config.toml
        # and swap gdm out; that lives in /etc so it survives image updates.
        - dms-greeter  # copr: avengemedia/danklinux

        # DankMaterialShell desktop (the sidescroll rice). These were local
        # rpm-ostree layers until 2026-07-27; see the pinned block further down
        # for why they are not just listed here as bare names.
        - danksearch  # copr: avengemedia/danklinux; file-search backend for the launcher
        - material-symbols-fonts  # copr: avengemedia/danklinux
        - wf-recorder
        - poppler-utils  # pdftotext, for indexing PDF text into danksearch
        # Recommends of dms, named explicitly because the dms install below
        # runs with install-weak-deps: false. cava drives the audio visualiser.
        - cava
        - qt6-qtmultimedia

        # matugen MUST come from Fedora, not from the danklinux copr. Fedora has
        # 3.1.0, danklinux has 4.1.0, and the rice is built and verified against
        # 3.1.0 (DMS takes a different code path for v4). On the host this pin is
        # enforced by `excludepkgs=matugen ghostty cliphist qt6ct-kde` in the
        # danklinux .repo file, which the image build does not inherit.
        # matugen is a *Recommends* of dms, so a plain `- dms` with weak deps on
        # would silently drag in 4.1.0. Hence: pin matugen to the fedora repo,
        # and install dms with weak deps off.
        - repo: fedora
          packages:
            - matugen
        # No repo: scoping needed here, avengemedia/dms is the only repo that
        # carries dms. The weak-deps flag is the load-bearing part.
        - install-weak-deps: false
          packages:
            - dms
        # Same story for ghostty: danklinux has 1.3.1-1, scottames has 1.3.1-2.
        - repo: copr:copr.fedorainfracloud.org:scottames:ghostty
          packages:
            - ghostty

        # AGS v2 desktop shell (bar/quick-settings/notifications, ~/.config/ags).
        # niri-shell script prefers it over waybar+swaync once present.
        - aylurs-gtk-shell2  # ags CLI + runtime; copr: solopasha/hyprland
        - astal-gtk4  # copr: solopasha/hyprland
        - astal-libs  # Astal{Battery,Network,Bluetooth,Mpris,Notifd,Tray,Wp,…} typelibs

        # Wayland Tools
        - fuzzel
        - grim
        - slurp
        - wlr-randr
        - wlsunset
        - brightnessctl
        - swappy
        - dunst
        - imv
        - waypipe
        - wl-clipboard

        # Audio/Video
        - pavucontrol
        - pulseaudio-utils
        - pamixer
        - playerctl

        # Bluetooth
        - bluez-tools
        - blueman

        # Authentication
        - fprintd-pam
        - gnome-keyring-pam
        - lxqt-policykit
        - pinentry-gnome3

        # Desktop Portals (wlroots portal for niri)
        - xdg-desktop-portal-wlr

        # Qt Wayland
        - qt5-qtwayland
        - qt6-qtwayland

        # Vulkan
        - vulkan-validation-layers
        - vulkan-tools

        # GNOME/GTK
        - gnome-disk-utility
        - google-noto-emoji-fonts
        - gnome-shell-extension-pop-shell
        - network-manager-applet
        - system-config-printer

        # File Managers & Tools
        - Thunar
        - thunar-archive-plugin
        - thunar-volman
        - xarchiver

        # Android apps via Waydroid (ujust setup-waydroid; recipe in
        # config/justfiles/waydroid.just, net patch in
        # config/scripts/patch-waydroid-net.sh)
        - waydroid
        - waydroid-selinux  # policy module so waydroid runs with SELinux enforcing

        # Other Tools
        - jmtpfs
        - flameshot
        - hunspell-en
        - hunspell-en-US
        - fuse-libs  # libfuse.so.2 for the Beeper AppImage (/usr/bin/beeper)

        # claude-cowork-linux dependencies
        - nodejs
        - npm
        - 7zip  # ships /usr/bin/7z; replaced p7zip in Fedora
        - bubblewrap

        # claude-science dependencies (also uses bubblewrap, above)
        - socat  # claude-science sandbox networking (cli/src/sandbox/socat.ts)

        - power-profiles-daemon  # conflicts with tuned-ppd (removed below)

    remove:
      packages:
        - tuned-ppd  # Conflicts with power-profiles-daemon

  - type: brew
    auto-update: true
    update-interval: '6h'
    update-wait-after-boot: '10min'
    auto-upgrade: true
    upgrade-interval: '8h'
    upgrade-wait-after-boot: '30min'
    nofile-limits: false
    brew-analytics: false  # opt out of Homebrew's InfluxDB telemetry (writes
                           # HOMEBREW_NO_ANALYTICS=1); matches the recipe's VPN/privacy posture

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://dl.flathub.org/repo/flathub.flatpakrepo
          name: flathub
          title: "Flathub (system-wide)"
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.valvesoftware.Steam
          - com.mattjakeman.ExtensionManager
          - md.obsidian.Obsidian
          - net.ankiweb.Anki
          - page.kramo.Cartridges
          - com.usebottles.bottles
          - com.vysp3r.ProtonPlus
          - net.davidotek.pupgui2
          - net.codelogistics.webapps
          - com.bitwarden.desktop
          - org.telegram.desktop
          - com.slack.Slack
          - org.gnome.baobab
          - net.nokyan.Resources
          - com.github.tchx84.Flatseal
          - org.kde.okular
          - com.discordapp.Discord
          - io.gitlab.liferooter.TextPieces
          - io.github.flattool.Warehouse
          - org.DolphinEmu.dolphin-emu
          - com.jeffser.Alpaca
          - im.riot.Riot
          - com.stremio.Stremio
          - org.gnome.Fractal
          - com.ticktick.TickTick
          - org.libreoffice.LibreOffice
          - com.wps.Office
          - com.gopeed.Gopeed
          - org.qbittorrent.qBittorrent
          - org.chromium.Chromium
          - com.github.wwmm.easyeffects
          - com.github.rafostar.Clapper
          # --- Reconciled from the live system 2026-07-15 (apps installed
          #     post-provision). A few GNOME/KDE utilities may already ship in
          #     the bluefin-dx base; listing them is idempotent/harmless. ---
          - app.zen_browser.zen
          - chat.simplex.simplex
          - com.calibre_ebook.calibre
          - com.github.Matoking.protontricks
          - com.github.PintaProject.Pinta
          - com.github.zocker_160.SyncThingy
          - com.obsproject.Studio
          - com.protonvpn.www
          - com.quexten.Goldwarden
          - com.ranfdev.DistroShelf
          - com.spotify.Client
          - com.system76.Popsicle
          - com.wireframesketcher.WireframeSketcher
          - de.haeckerfelix.Fragments
          - dev.fredol.open-tv # IPTV player for Dispatcharr (added 2026-07-26)
          - io.github.dvlv.boxbuddyrs
          - io.github.kolunmi.Bazaar
          - io.mgba.mGBA
          - io.missioncenter.MissionCenter
          - network.loki.Session
          - org.altlinux.Tuner
          - org.azahar_emu.Azahar
          - org.fedoraproject.MediaWriter
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Characters
          - org.gnome.clocks
          - org.gnome.Contacts
          - org.gnome.Evince
          - org.gnome.font-viewer
          - org.gnome.gThumb
          - org.gnome.Logs
          - org.gnome.NautilusPreviewer
          - org.gnome.OfficeRunner
          - org.gnome.Papers
          - org.gnome.seahorse.Application
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.gnome.Weather
          - org.gnome.World.PikaBackup
          - org.kde.filelight
          - org.kde.gwenview
          - org.kde.haruna
          - org.kde.isoimagewriter
          - org.mozilla.thunderbird_esr
          - org.onlyoffice.desktopeditors
          - org.videolan.VLC
          # Known risk, accepted 2026-07-26: PlexDesktop still pins the EOL
          # freedesktop 23.08 runtime (both official Plex flatpaks do). Upstream
          # fix pending: https://github.com/flathub/tv.plex.PlexDesktop/pull/139
          # bumps to 25.08; a regular flatpak update picks it up once merged.
          - tv.plex.PlexDesktop # (added 2026-07-26)
          - us.zoom.Zoom
      - scope: user
        repo:
          name: flathub-user
          title: "Flathub (User)"
        install: []

  - type: script
    scripts:
      - getbeeper.sh
      - getbibata-cursor.sh
      - getclaude-cowork.sh
      - getclaude-science.sh
      - getmodal.sh
      - getwindscribe.sh
      - patch-waydroid-net.sh

  # Validates config/justfiles/*.just at build time and imports them into
  # ujust via /usr/share/ublue-os/just/60-custom.just.
  - type: justfiles
    validate: true

  - type: fonts
    fonts:
      nerd-fonts:
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
        - Inconsolata
      google-fonts:
        - Roboto

  - type: bling
    install:
      - dconf-update-service

  - type: chezmoi
    repository: "https://github.com/AsirShahid/dotfiles"
    all-users: true
    file-conflict-policy: "skip"

  - type: gschema-overrides
    include:
      - zz1-myoverride.gschema.override

  - type: gnome-extensions
    install:
      - Night Theme Switcher
      - Blur my Shell
      - Bluetooth Battery Meter
      - Caffeine
      - 8834  # Copyous - Clipboard Manager

  - type: systemd
    system:
      enabled:
        - power-profiles-daemon.service
        - windscribe-helper.service  # Windscribe kill-switch/firewall daemon (RPM preset no-ops in offline build)
        # coldturkey NSFW blocker (files/usr/bin/coldturkey + seeds in
        # files/usr/share/coldturkey; /etc populated on first enforce)
        - coldturkey-enforce.timer
        - coldturkey-watch.path
        - coldturkey-update.timer
        - coldturkey-listserv.service
      disabled:
        - waydroid-container.service  # ujust setup-waydroid enables it on init
        - tuned.service  # the tuned package (not tuned-ppd) stays in the base and
                         # its service is preset-enabled; power-profiles-daemon.service
                         # declares Conflicts=tuned.service, so leaving both enabled
                         # lets systemd pick the winner at boot. Disable tuned so ppd
                         # wins deterministically.

  - type: signing
